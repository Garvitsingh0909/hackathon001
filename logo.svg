<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Water Drop / Eye Container -->
  <path d="M256 32 C160 160 64 224 64 320 C64 426 150 512 256 512 C362 512 448 426 448 320 C448 224 352 160 256 32 Z" fill="url(#waterGrad)"/>
  
  <!-- Inner Eye Shape (White Sclera) -->
  <path d="M128 320 C128 320 192 240 256 240 C320 240 384 320 384 320 C384 320 320 400 256 400 C192 400 128 320 128 320 Z" fill="white"/>
  
  <!-- Iris (Teal/Blue) -->
  <circle cx="256" cy="320" r="48" fill="#1CA7A6" stroke="#0B1F3B" stroke-width="4"/>
  
  <!-- Pupil -->
  <circle cx="256" cy="320" r="20" fill="#0B1F3B"/>
  
  <!-- Reflection -->
  <circle cx="240" cy="300" r="8" fill="white" opacity="0.8"/>
  
  <!-- Tech Circuit Accents (AI feel) -->
  <circle cx="256" cy="320" r="60" fill="none" stroke="#0B1F3B" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M256 180 L256 220" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M256 420 L256 460" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
