<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JalDrishti AI - Governance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      :root {
        --gov-navy: #0B1F3B;
        --gov-teal: #1CA7A6;
        --gov-blue-light: #eff6ff;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8FAFC; /* Slate 50 */
        -webkit-font-smoothing: antialiased;
        color: #0f172a; /* Slate 900 */
      }

      /* Micro-interactions */
      .btn-press:active {
        transform: scale(0.98);
      }

      /* Custom scrollbar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Animations */
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      @keyframes ripple {
        0% { transform: scale(0.95); opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .animate-ripple {
        animation: ripple 3s infinite ease-out;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(28, 167, 166, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(28, 167, 166, 0); }
        100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(28, 167, 166, 0); }
      }
      .animate-pulse-ring {
        animation: pulse-ring 2s infinite;
      }

      /* Glassmorphism */
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.3);
      }
    </style>
